version: '3'
services:
  teddymart-staging:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      args:
          PHP_FPM_PORT: 9010
    container_name: teddymart-staging
    restart: unless-stopped
    ports:
      - "9010:9010"
    volumes:
      - .:/var/www
    networks:
      tednet:
        ipv4_address: 172.23.0.4
networks:
  tednet:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.23.0.0/24