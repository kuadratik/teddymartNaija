[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
minfds=10000

[program:php-artisan-schedule]
command=sh -c 'while true; do php /var/www/artisan schedule:work --verbose --no-interaction; sleep 60; done'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:reverb-server]
command=php /var/www/artisan reverb:start --host="0.0.0.0"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile= /var/www/storage/logs/reverb.log
