      summary: Get user advert listings
      description: Retrieve a list of advert listings for the authenticated user with optional filters
      operationId: GetUserAdvertListing
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: session-uid
          schema:
            type: string
          required: true
          description: Session UID of the user
        - in: query
          name: status
          schema:
            type: string
          required: false
          description: Status of the advert's promotion plan
        - in: query
          name: category_id
          schema:
            type: integer
          required: false
          description: Category ID to filter listings
        - in: query
          name: type
          schema:
            type: string
          required: false
          description: Type of the listing

        - in: query
          name: search
          schema:
            type: string
          required: false
          description: Keyword to search within titles and descriptions
        - in: query
          name: sort
          schema:
            type: string
            enum: [created_at, price]
          required: false
          description: Field to sort by (created_at or price)
        - in: query
          name: order
          schema:
            type: string
            enum: [asc, desc]
          required: false
          description: Sort order, either asc or desc
        - in: query
          name: per_page
          schema:
            type: integer
            default: 15
          required: false
          description: Number of items per page for pagination
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/advert/gallery:
    post:
      tags:
        - Advertisement
      summary: Get all advert listings with filters and pagination
      description: |
        Retrieve all advert listings with optional filtering, sorting, and pagination options.
        Filters include: status, category_id, type, price range, state, creation date, and search term.
      operationId: GetAllAdverts
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: session-uid
          schema:
            type: string
          required: true
          description: The unique session identifier for the user.
        - in: header
          name: currency
          schema:
            type: string
            example: USD
          required: true
          description: Currency code to filter listings by.
        - in: query
          name: status
          schema:
            type: string
            example: active
          required: false
          description: Filter by promotion status (active,expired).
        - in: query
          name: type
          schema:
            type: string
          required: false
          description: Filter by listing type (product , service).
        - in: query
          name: price_min
          schema:
            type: number
            format: float
          required: false
          description: Minimum price for listings plan.
        - in: query
          name: price_max
          schema:
            type: number
            format: float
          required: false
          description: Maximum price for listings plan.

        - in: query
          name: search
          schema:
            type: string
          required: false
          description: Search term to match in title or description.
        - in: query
          name: per_page
          schema:
            type: integer
            default: 15
          required: false
          description: Number of listings per page.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  type: array
                  example: [1, 2, 3]
                  required: false
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

