  /front/cart/{cart}/payment:
    post:
      tags:
        - Payment
      summary: Make payment for cart order
      description: Make payment for cart order, supporting multiple stores with individual shipping methods.
      operationId: MakePayment
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: session-uid
          schema:
            type: string
            example: "abc123-session-id"
          required: true
          description: "Session UID for the authenticated user"
        - in: path
          name: cart
          schema:
            type: string
            example: "1"
          required: true
          description: "Cart ID to process the order"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_gateway:
                  type: string
                  example: "paypal"
                  description: "Selected payment gateway (paystack, paypal, stripe)"
                  required: true
                currency_code:
                  type: string
                  example: "USD"
                  description: "Currency code for the payment"
                  required: true
                first_name:
                  type: string
                  example: "Teddy"
                  description: "Customer's first name"
                  required: true
                last_name:
                  type: string
                  example: "Edwardson"
                  description: "Customer's last name"
                  required: true
                email:
                  type: string
                  example: "teddyedward@teddyed.com"
                  description: "Customer's email address"
                  required: true
                phone:
                  type: string
                  example: "2348012345678"
                  description: "Customer's phone number"
                  required: true
                shipping_address_id:
                  type: integer
                  example: 1
                  description: "ID of the shipping address to be used"
                  required: true
                store_shipping_methods:
                  type: array
                  description: "Array of shipping methods selected for each store"
                  items:
                    type: object
                    properties:
                      store_id:
                        type: integer
                        example: 1
                        description: "ID of the store"
                        required: true
                      shipping_method_id:
                        type: integer
                        example: 2
                        description: "ID of the shipping method selected for the store"
                        required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

