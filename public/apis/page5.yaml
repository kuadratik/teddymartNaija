openapi: 3.0.0
info:
  title: TeddyMart Admin API
  version: 1.0.0
  description: Admin authentication, brand management, and store management endpoints for TeddyMart backend

servers:
  - url: http://localhost:8000/api
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /admin/login:
    post:
      tags:
        - Admin Authentication
      summary: Admin login
      description: Authenticate admin user and receive access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@myeki.market
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        default:
          description: success

  /admin/logout:
    post:
      tags:
        - Admin Authentication
      summary: Admin logout
      description: Logout admin user and revoke access token
      security:
        - bearerAuth: []
      responses:
        default:
          description: success

  /admin/brands:
    get:
      tags:
        - Brands
      summary: List brands
      description: Retrieve all brands, with optional filters and search
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Search by brand name or description
          required: false
          schema:
            type: string
            example: "Nike"
        - name: category_id
          in: query
          description: Filter by brand category ID
          required: false
          schema:
            type: integer
            example: 3
        - name: is_active
          in: query
          description: Filter by active status (true or false)
          required: false
          schema:
            type: boolean
            example: true
        - name: include_archived
          in: query
          description: Include archived brands (true or false)
          required: false
          schema:
            type: boolean
            example: false
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            example: 1
        - name: per_page
          in: query
          description: Number of results per page
          required: false
          schema:
            type: integer
            example: 5
      responses:
        default:
          description: success
    post:
      tags:
        - Brands
      summary: Create new brand
      description: Create a new brand entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - category_ids
              properties:
                name:
                  type: string
                  example: Nike
                category_ids:
                  type: array
                  items:
                    type: integer
                  example: [1, 2, 3]
                description:
                  type: string
                  example: Sportswear brand
                logo_url:
                  type: string
                  example: /uploads/temp/nike.png
                source_url:
                  type: string
                  example: https://nike.com
                target_url:
                  type: string
                  example: https://store.nike.com
                is_active:
                  type: boolean
                  example: true
      responses:
        default:
          description: success

  /admin/brands/{brand}:
    get:
      tags:
        - Brands
      summary: Get brand details
      description: Retrieve a single brand by ID
      security:
        - bearerAuth: []
      parameters:
        - name: brand
          in: path
          required: true
          schema:
            type: integer
          example: 5
      responses:
        default:
          description: success
    put:
      tags:
        - Brands
      summary: Update brand
      description: Update existing brand information
      security:
        - bearerAuth: []
      parameters:
        - name: brand
          in: path
          required: true
          schema:
            type: integer
          example: 5
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Adidas
                category_ids:
                  type: array
                  items:
                    type: integer
                  example: [1, 2]
                description:
                  type: string
                  example: Updated sportswear brand
                logo_url:
                  type: string
                  example: /uploads/temp/adidas.png
                source_url:
                  type: string
                  example: https://adidas.com
                target_url:
                  type: string
                  example: https://store.adidas.com
                is_active:
                  type: boolean
                  example: false
      responses:
        default:
          description: success
    delete:
      tags:
        - Brands
      summary: Delete brand
      description: Remove a brand by ID
      security:
        - bearerAuth: []
      parameters:
        - name: brand
          in: path
          required: true
          schema:
            type: integer
          example: 5
      responses:
        default:
          description: success

  /admin/brands/{brand}/archive:
    patch:
      tags:
        - Brands
      summary: Archive a brand
      description: Archive a brand by setting `is_archived` to true
      security:
        - bearerAuth: []
      parameters:
        - name: brand
          in: path
          required: true
          schema:
            type: integer
          example: 5
      responses:
        default:
          description: success

  /admin/brands/{brand}/unarchive:
    patch:
      tags:
        - Brands
      summary: Unarchive a brand
      description: Restore a previously archived brand by setting `is_archived` to false
      security:
        - bearerAuth: []
      parameters:
        - name: brand
          in: path
          required: true
          schema:
            type: integer
          example: 5
      responses:
        default:
          description: success

  /admin/brands/slug-recommendation:
    post:
      tags:
        - Brands
      summary: Generate slug recommendation
      description: Generate a URL-friendly slug from brand name
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Nike Air Max"
      responses:
        default:
          description: success

  /admin/brands/categories/all:
    get:
      tags:
        - Brand Categories
      summary: Get all brand categories
      description: Retrieve a list of brand categories
      security:
        - bearerAuth: []
      responses:
        default:
          description: success

  /admin/brands/categories:
    post:
      tags:
        - Brand Categories
      summary: Create new brand category
      description: Create a new brand category entry
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Sportswear
      responses:
        default:
          description: success

  /admin/brands/history:
    get:
      tags:
        - Brand History
      summary: Get brand change history
      description: Retrieve brand modification history with optional search
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Search across brand name, admin name, slugs, and URLs
          required: false
          schema:
            type: string
            example: "nike"
        - name: brand_id
          in: query
          description: Filter history by specific brand ID
          required: false
          schema:
            type: integer
            example: 1
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            example: 1
      responses:
        default:
          description: success

  /admin/stores/{store}/deactivate:
    patch:
      tags:
        - Store Management
      summary: Deactivate store
      description: Deactivate a store by setting active to false
      security:
        - bearerAuth: []
      parameters:
        - name: store
          in: path
          required: true
          schema:
            type: string
          example: nike-store
      responses:
        default:
          description: success

  /admin/stores/{store}/activate:
    patch:
      tags:
        - Store Management
      summary: Activate store
      description: Activate a store by setting active to true
      security:
        - bearerAuth: []
      parameters:
        - name: store
          in: path
          required: true
          schema:
            type: string
          example: nike-store
      responses:
        default:
          description: success
