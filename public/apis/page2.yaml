openapi: "3.0.0"
info:
  description: Teddyed apis
  version: 1.0.0
  title: Teddyed

servers:
  - url: /api
    description: v1 baseUrl

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /store/user-store:
    get:
      security:
        - bearerAuth: []
      tags:
        - User Store
      summary: Get User Store Info
      description: "Get User Store Info"
      operationId: GetUserStoreTnfo
      parameters:
        - in: header
          name: currency
          schema:
            type: string
            example: USD
          required: false
          description: Currency code to filter listings by.
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/user-store/{userStore}/overall-metrics:
    get:
      security:
        - bearerAuth: []
      tags:
        - User Store
      summary: Get User Store Overall Metrics
      description: "Get User Store Overall Metrics"
      operationId: GetUserStoreOverallMetrics
      parameters:
        - in: path
          name: userStore
          schema:
            type: string
            example: amala-sky
          required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/user-store/{userStore}/metrics:
    get:
      security:
        - bearerAuth: []
      tags:
        - User Store
      summary: Get User Store Metrics
      description: "Get User Store Metrics"
      operationId: GetUserStoreMetrics
      parameters:
        - in: path
          name: userStore
          schema:
            type: string
            example: amala-sky
          required: true
        - in: query
          name: listingType
          schema:
            type: string
            example: product
          required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/create:
    post:
      security:
        - bearerAuth: []
      tags:
        - User Store
      summary: Create User Store
      description: Create User Store
      operationId: CreateUserStore

      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Amala Sky"
                contact_number:
                  type: string
                  example: "1234567898"
                whatsapp_number:
                  type: string
                  example: "1234567890"
                profile_picture_path:
                  type: string
                  example: ""
                banner_path:
                  type: string
                  example: ""
                description:
                  type: string
                  example: "The best amala in ibadan"
                address1:
                  type: string
                  example: "oluyole ibadan"
                address2:
                  type: string
                  example: "Good arena , eleyele ibadan"
                state:
                  type: string
                  example: "oyo"
                city:
                  type: string
                  example: "ibadan"
                postal_code:
                  type: string
                  example: "100001"
                country:
                  type: integer
                  example: 38
                offers_service:
                  type: string
                  example: false
                offers_product:
                  type: string
                  example: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/{userStore}/update:
    patch:
      security:
        - bearerAuth: []
      tags:
        - User Store
      summary: Update User Store
      description: Update User Store
      operationId: UpdateUserStore
      parameters:
        - in: path
          name: userStore
          schema:
            type: string
            example: amala-sky
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Amala Sky"
                contact_number:
                  type: string
                  example: "1234567898"
                whatsapp_number:
                  type: string
                  example: "1234567890"
                profile_picture_path:
                  type: string
                  example: ""
                banner_path:
                  type: string
                  example: ""
                description:
                  type: string
                  example: "The best amala in ibadan"
                address1:
                  type: string
                  example: "oluyole ibadan"
                address2:
                  type: string
                  example: "Good arena , eleyele ibadan"
                state:
                  type: string
                  example: "oyo"
                city:
                  type: string
                  example: "ibadan"
                postal_code:
                  type: string
                  example: "100001"
                country:
                  type: integer
                  example: 38
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/{userStore}/listings:
    get:
      security:
        - bearerAuth: []
      tags:
        - User Store Listings
      summary: Get User Store Listings
      description: "Get User Store Listings"
      operationId: GetUserStoreListings
      parameters:
        - in: path
          name: userStore
          schema:
            type: string
            example: amala-sky
          required: true
        - in: query
          name: listingType
          schema:
            type: string
            example: "product"
          required: true
        - in: query
          name: availability
          schema:
            type: boolean
            example: true
          required: false
        - in: query
          name: is_draft
          schema:
            type: boolean
            example: false
        - in: query
          name: search
          schema:
            type: string
            example: "amala"
          required: false
        - in: query
          name: sort_date
          schema:
            type: string
            enum:
              - oldest
              - newest
            example: "newest"
          required: false
        - in: query
          name: sort_price
          schema:
            type: string
            enum:
              - highest
              - lowest
            example: "lowest"
          required: false

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/{userStore}/listings/create:
    post:
      security:
        - bearerAuth: []
      tags:
        - User Store Listings
      summary: Create User Store Listing
      description: Create a new listing for a user store with details such as name, price, attributes, and variants.
      operationId: CreateUserStoreListing
      parameters:
        - in: path
          name: userStore
          schema:
            type: string
            example: "amala-sky"
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Amala Full Plate"
                type:
                  type: string
                  enum:
                    - product
                    - service
                  example: "product"
                price:
                  type: number
                  example: 1000
                  description: Required if type is "product."
                description:
                  type: string
                  maxLength: 500
                  example: "Delicious Amala served with your choice of soup."
                additional_information:
                  type: string
                  maxLength: 1000
                  example: "Can be customized with different soups."
                quantity:
                  type: integer
                  minimum: 0
                  example: 50
                images:
                  type: array
                  items:
                    type: string
                  example:
                    - "teddymart/images/UqcW7siP6S4VYg4ZjrGB.png"
                    - "teddymart/images/UqcW7siP6S4VYg4ZjrGB.png"
                category:
                  type: integer
                  example: 11
                  description: Must exist in the categories table.
                discount:
                  type: number
                  minimum: 0
                  maximum: 100
                  example: 10
                discount_start_date:
                  type: string
                  format: date
                  example: "2024-11-01"
                  description: Required if discount is provided.
                discount_end_date:
                  type: string
                  format: date
                  example: "2024-11-30"
                  description: Must be after discount_start_date.
                sku:
                  type: string
                  maxLength: 50
                  example: "AMALAFP001"
                is_draft:
                  type: boolean
                  example: false
                attributes:
                  type: object
                  properties:
                    measurement:
                      type: array
                      items:
                        type: object
                        properties:
                          value:
                            type: number
                            example: 10
                          unit:
                            type: string
                            example: "inches"
                    product_model:
                      type: string
                      example: "Amala2024"
                    brand:
                      type: string
                      example: "Amala Heaven"
                    material:
                      type: string
                      example: "Wheat flour"
                    color:
                      type: string
                      example: "Brown"
                    size:
                      type: array
                      items:
                        type: string
                      example: ["Large", "Medium", "Small"]
                    tags:
                      type: array
                      items:
                        type: string
                      example: ["amala", "food", "delicious"]
                    size_chart_html:
                      type: string
                      example: "<h3>Size Chart</h3><ul><li>Large: 10x10 inches</li><li>Medium: 8x8 inches</li></ul>"
                    size_chart_image:
                      type: string
                      example: "teddymart/images/UqcW7siP6S4VYg4ZjrGB.png"
                variants:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "Amala with Goat Meat"
                      quantity:
                        type: integer
                        minimum: 0
                        example: 50
                      price:
                        type: number
                        minimum: 0
                        example: 1500
                      discount:
                        type: number
                        minimum: 0
                        maximum: 100
                        example: 5
                      size:
                        type: string
                        example: "Large"
                      color:
                        type: string
                        example: "Brown"
                      measurement:
                        type: array
                        items:
                          type: object
                          properties:
                            value:
                              type: number
                              example: 10
                            unit:
                              type: string
                              example: "inches"
                      discount_start_date:
                        type: string
                        format: date
                        example: "2024-11-01"
                      discount_end_date:
                        type: string
                        format: date
                        example: "2024-11-30"
                      images:
                        type: array
                        items:
                          type: string
                        example:
                          - "teddymart/images/UqcW7siP6S4VYg4ZjrGB.png"
                          - "teddymart/images/UqcW7siP6S4VYg4ZjrGB.png"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/listings/{userStore}/listing/{listing}:
    get:
      security:
