openapi: '3.0.0'
info:
  description: Teddyed apis
  version: 1.0.0
  title: Teddyed

servers:
  - url: /api
    description: v1 baseUrl

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /parents:
    get:
      security:
        - bearerAuth: []
      tags:
        - parent
      summary: Get school parents
      description: 'Get school parents'
      operationId: getSchoolParent
      parameters:
        - in: header
          name: school
          schema:
            type: number
            example: 2621
          required: true
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /parents/guardians/list:
    get:
      security:
        - bearerAuth: []
      tags:
        - parent
      summary: Get school guardians with app access
      description: Get school guardians with app access
      operationId: getSchoolParentGuardians
      parameters:
        - in: header
          name: school
          schema:
            type: number
            example: 2621
          required: true
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /parents/{parent}:
    get:
      security:
        - bearerAuth: []
      tags:
        - parent
      summary: Get school parent information
      description: 'Get school parent information'
      operationId: getSchoolParentDetails
      parameters:
        - in: header
          name: school
          schema:
            type: number
            example: 2621
          required: true
        - in: path
          name: parent
          schema:
            type: number
            example: 0
          required: true
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /parents/create:
    post:
      security:
        - bearerAuth: []
      tags:
        - parent
      summary: Create school parent
      description: Create school parent
      operationId: CreateParentDetails
      parameters:
        - in: header
          name: school
          schema:
            type: number
            example: 2621
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "jon"
                last_name:
                  type: string
                  example: "bellion"
                other_name:
                  type: string
                  example: "jamie"
                email:
                  type: string
                  example: "jamie@gmail.com"
                mobile_number:
                  type: string
                  example: "4545454545"
                home_number:
                  type: string
                  example: "451268787545"
                address_one:
                  type: string
                  example: "good valley"
                address_two:
                  type: string
                  example: "Good arena"
                country_id:
                  type: string
                  example: ""
                state_id:
                  type: string
                  example: ""
                city:
                  type: string
                  example: ""
                postal_code:
                  type: string
                  example: ""
                login_mail:
                  type: string
                  example: "jenssen007@example.com"
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /parents/{parent}/update:
    post:
      security:
        - bearerAuth: []
      tags:
        - parent
      summary: Update parent information
      description:  Update parent information
      operationId: updateSchoolParentDetails
      parameters:
        - in: header
          name: school
          schema:
            type: number
            example: 2621
          required: true
        - in: path
          name: parent
          schema:
            type: number
            example: 0
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "jon"
                last_name:
                  type: string
                  example: "bellion"
                other_name:
                  type: string
                  example: "jamie"
                email:
                  type: string
                  example: "jamie@gmail.com"
                mobile_number:
                  type: string
                  example: "4545454545"
                home_number:
                  type: string
                  example: "451268787545"
                address_one:
                  type: string
                  example: "good valley"
                address_two:
                  type: string
                  example: "Good arena"
                country_id:
                  type: string
                  example: ""
                state_id:
                  type: string
                  example: ""
                city:
                  type: string
                  example: ""
                postal_code:
                  type: string
                  example: ""
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object
  
# =================================================================================================================================================
# Attendances endpoint
# =================================================================================================================================================
  /attendances/grades:
    get:
      security:
        - bearerAuth: []
      tags:
        - attendance
      summary: Get school classes with  attendance
      description: ' Get school classes with  attendance'
      operationId: getSchoolClasses
      parameters:
        - in: header
          name: school
          schema:
            type: number
            example: 2621
          required: true
        - in: query
          name: from
          schema:
            type: date
            example: '2023-03-21 00:00:00'
        - in: query
          name: to
          schema:
            type: date
            example: '2023-03-21 23:59:59'
        - in: query
          name: session
          schema:
            type: number
            example: 
          required: false
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /attendances/{date}/marked:
    get:
      security:
        - bearerAuth: []
      tags:
        - attendance
      summary: Get atttendance taken for a date
      description: "Get atttendance taken for a date"
      operationId: getDateAttendance
      parameters:
        - in: header
          name: school
          schema:
            type: number
            example: 2621
          required: true
        - in: path
          name: date
          schema:
            type: string
            example: "2023-04-03"
          required: true
        - in: query
          name: grade
          schema:
            type: number
            example: ""
        - in: query
          name: status
          schema:
            type: string
            example: ""
        - in: query
          name: search
          schema:
            type: string
            example: ""
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /attendances/grades/{grade}/mark:
    put:
      security:
        - bearerAuth: []
      tags:
        - attendance
      summary: Mark attendance for class
      description: "Mark attendance for class"
      operationId: markAttendance
      parameters:
        - in: header
          name: school
          schema:
            type: number
            example: 2621
          required: true
        - in: path
          name: grade
          schema:
            type: number
            example: ""
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  example: "2023-04-03"
                students:
                  type: array
                  example:
                    [
                      {
                        "student_id": 5,
                        "status": "present",
                        "reason": "sick",
                        "is_compliance": true,
                        "compliance_reason": "wrong shoe",
                        "is_late": false,
                        "late_reason": null,
                      },
                    ]
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /attendances/grades/{grade}/students:
    get:
      security:
        - bearerAuth: []
      tags:
        - attendance
      summary: Get class student for attendance
      description: Get class student for attendance
      operationId: getGradeStudents
      parameters:
        - in: header
          name: school
          schema:
            type: number
            example: 2621
          required: true
        - in: path
          name: grade
          schema:
            type: number
            example: 2
          required: true
        - in: query
          name: date
          schema:
            type: date
            example: '2023-03-21'
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /attendances/{attendance}/update:
    patch:
      security:
        - bearerAuth: []
      tags:
        - attendance
      summary: Update attendance for single student on admin
      description: Update attendance for single student on admin
      operationId: markSingleAttendance
      parameters:
        - in: header
          name: school
          schema:
            type: number
            example: 2621
          required: true
        - in: query
          name: attendance
          schema:
            type: number
            example: 0
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  example: "present"
                is_compliance:
                  type: boolean
                  example: false
                half_day:
                  type: boolean
                  example: false
                reason:
                  type: string
                  example: "sick"
                compliance_reason:
                  type: string
                  example: "Torn shirt"
                academic_date:
                  type: string
                  example: "2020-03-03"
                is_late:
                  type: boolean
                  example: false
                late_reason:
                  type: string
                  example: null
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /attendances/presence-reports:
    get:
      security:
        - bearerAuth: []
      tags:
        - attendance
      summary: All grouped absence reports
      description: All grouped absence reports
      operationId: AllGroupedAbsenceReports
      parameters:
        - in: header
          name: school
          schema:
            type: number
            example: 2621
          required: true
        - in: query
          name: search
          schema:
            type: string
            example: 
        - in: query
          name: grade
          schema:
            type: string
            example: 
        - in: query
          name: type
          schema:
            type: string
            description: lateness|absence
            example: absence
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object


  /attendances/chart:
    get:
      security:
        - bearerAuth: []
      tags:
        - attendance
      summary: Get Attendance chart
      description: "Get Attendance chart"
      operationId: getAttendanceChart
      parameters:
        - in: header
          name: school
          schema:
            type: number
            example: 2621
          required: true
        - in: query
          name: date_from
          schema:
            type: string
            example: "2023-04-30"
          required: true
        - in: query
          name: date_to
          schema:
            type: string
            example: "2023-04-30"
          required: true
        - in: query
          name: grade
          schema:
            type: number
            description: "optional remove from param if not needed"
            example: 2
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /attendances/grades/{grade}/reports:
    get:
      security:
        - bearerAuth: []
      tags:
        - attendance
      summary: Get Attendance table report for attendance admin
      description: Get Attendance table report for attendance admin
      operationId: getTableReport
      parameters:
        - in: header
          name: school
          schema:
            type: number
            example: 2621
          required: true
        - in: path
          name: grade
          schema:
            type: number
            example: 2
          required: true
        - in: query
          name: range
          schema:
            type: string
            enum:
              - months
              - weekdays
          required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object


