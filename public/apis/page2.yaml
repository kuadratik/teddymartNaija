openapi: "3.0.0"
info:
  description: Teddyed apis
  version: 1.0.0
  title: Teddyed

servers:
  - url: /api
    description: v1 baseUrl

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /store/user-store:
    get:
      security:
        - bearerAuth: []
      tags:
        - User Store
      summary: Get User Store Info
      description: "Get User Store Info"
      operationId: GetUserStoreTnfo
      parameters:
        - in: header
          name: currency
          schema:
            type: string
            example: USD
          required: false
          description: Currency code to filter listings by.
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/user-store/{userStore}/metrics:
    get:
      security:
        - bearerAuth: []
      tags:
        - User Store
      summary: Get User Store Metrics
      description: "Get User Store Metrics"
      operationId: GetUserStoreMetrics
      parameters:
        - in: path
          name: userStore
          schema:
            type: string
            example: amala-sky
          required: true
        - in: query
          name: listingType
          schema:
            type: string
            example: product
          required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/create:
    post:
      security:
        - bearerAuth: []
      tags:
        - User Store
      summary: Create User Store
      description: Create User Store
      operationId: CreateUserStore

      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Amala Sky"
                contact_number:
                  type: string
                  example: "1234567898"
                whatsapp_number:
                  type: string
                  example: "1234567890"
                profile_picture_path:
                  type: string
                  example: ""
                banner_path:
                  type: string
                  example: ""
                description:
                  type: string
                  example: "The best amala in ibadan"
                address1:
                  type: string
                  example: "oluyole ibadan"
                address2:
                  type: string
                  example: "Good arena , eleyele ibadan"
                state:
                  type: string
                  example: "oyo"
                city:
                  type: string
                  example: "ibadan"
                postal_code:
                  type: string
                  example: "100001"
                country:
                  type: integer
                  example: 38
                offers_service:
                  type: string
                  example: false
                offers_product:
                  type: string
                  example: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/{userStore}/update:
    patch:
      security:
        - bearerAuth: []
      tags:
        - User Store
      summary: Update User Store
      description: Update User Store
      operationId: UpdateUserStore
      parameters:
        - in: path
          name: userStore
          schema:
            type: string
            example: amala-sky
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Amala Sky"
                contact_number:
                  type: string
                  example: "1234567898"
                whatsapp_number:
                  type: string
                  example: "1234567890"
                profile_picture_path:
                  type: string
                  example: ""
                banner_path:
                  type: string
                  example: ""
                description:
                  type: string
                  example: "The best amala in ibadan"
                address1:
                  type: string
                  example: "oluyole ibadan"
                address2:
                  type: string
                  example: "Good arena , eleyele ibadan"
                state:
                  type: string
                  example: "oyo"
                city:
                  type: string
                  example: "ibadan"
                postal_code:
                  type: string
                  example: "100001"
                country:
                  type: integer
                  example: 38
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/{userStore}/listings:
    get:
      security:
        - bearerAuth: []
      tags:
        - User Store Listings
      summary: Get User Store Listings
      description: "Get User Store Listings"
      operationId: GetUserStoreListings
      parameters:
        - in: path
          name: userStore
          schema:
            type: string
            example: amala-sky
          required: true

        - in: query
          name: listingType
          schema:
            type: string
            example: "product"
          required: true
        - in: query
          name: availability
          schema:
            type: boolean
            example: true
          required: true
        - in: query
          name: is_draft
          schema:
            type: boolean
            example: false
          required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/{userStore}/listings/create:
    post:
      security:
        - bearerAuth: []
      tags:
        - User Store Listings
      summary: Create User Store Listing
      description: Create a new listing for the user store, including details such as the product name, price, description, and other relevant attributes.
      operationId: CreateUserStoreListing
      parameters:
        - in: path
          name: userStore
          schema:
            type: string
            example: amala-sky
          required: true
          description: "Unique identifier for the user store."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Amala Full plate"
                  description: "Name of the product or listing."
                type:
                  type: string
                  example: "product"
                  description: "Type of the listing (e.g., product or service)."
                price:
                  type: string
                  example: "1000"
                  description: "Price of the listing."
                currency:
                  type: string
                  example: "USD"
                  enum: ["USD", "NGN", "CAD"]
                  description: "Currency of the price."
                description:
                  type: string
                  example: "Delicious Amala served with your choice of soup."
                  description: "A brief description of the listing."
                quantity:
                  type: integer
                  description: Available quantity
                  example: 1
                additional_information:
                  type: string
                  example: "Can be customized with different soups."
                  description: "Additional details about the listing."
                images:
                  type: array
                  items:
                    type: string
                  example:
                    - "teddymart/images/UqcW7siP6S4VYg4ZjrGB.png"
                    - "teddymart/images/UqcW7siP6S4VYg4ZjrGB.png"
                  description: "List of image filenames or URLs."
                category:
                  type: integer
                  example: 11
                  description: "Category ID for the listing."
                discount:
                  type: number
                  example: 10
                  description: "Discount percentage (optional)."
                discount_start_date:
                  type: string
                  format: date
                  example: "2024-11-01"
                  description: "Start date for the discount."
                discount_end_date:
                  type: string
                  format: date
                  example: "2024-11-30"
                  description: "End date for the discount."
                sku:
                  type: string
                  example: "AMALAFP001"
                  description: "Stock keeping unit identifier."
                is_draft:
                  type: boolean
                  example: false
                  description: "Whether the listing is in draft mode."
                attributes:
                  type: object
                  properties:
                    measurement:
                      type: string
                      example: "10x10 inches"
                      description: "Measurement details of the listing."
                    product_model:
                      type: string
                      example: "Amala2024"
                      description: "Model number or name."
                    brand:
                      type: string
                      example: "Amala Heaven"
                      description: "Brand of the product."
                    material:
                      type: string
                      example: "Wheat flour"
                      description: "Material composition of the product."
                    color:
                      type: string
                      example: "Brown"
                      description: "Primary color of the product."
                    size:
                      type: array
                      items:
                        type: object
                        properties:
                          size:
                            type: string
                            example: "Large"
                            description: "Size label."
                          unit:
                            type: string
                            example: "kg"
                            description: "Unit for the size."
                      example:
                        - size: "Large"
                          unit: "kg"
                        - size: "Medium"
                          unit: "kg"
                        - size: "Small"
                          unit: "kg"
                    tags:
                      type: array
                      items:
                        type: string
                      example: ["amala", "food", "delicious"]
                      description: "Tags associated with the listing."
                    size_chart_html:
                      type: string
                      example: "<h3>Size Chart</h3><ul><li>Large: 10x10 inches</li><li>Medium: 8x8 inches</li></ul>"
                      description: "HTML representation of the size chart."
                    size_chart_image:
                      type: string
                      example: "teddymart/images/UqcW7siP6S4VYg4ZjrGB.png"
                      description: "Image file for the size chart."
                variants:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "Amala with Goat Meat"
                        description: "Name of the variant."
                      quantity:
                        type: integer
                        example: 50
                        description: "Quantity available for the variant."
                      price:
                        type: string
                        example: "1500"
                        description: "Price of the variant."
                      discount:
                        type: number
                        example: 5
                        description: "Discount percentage for the variant (optional)."
                      size:
                        type: array
                        items:
                          type: object
                          properties:
                            size:
                              type: string
                              example: "Large"
                              description: "Size label for the variant."
                            unit:
                              type: string
                              example: "kg"
                              description: "Unit for the size."
                        example:
                          - size: "Large"
                            unit: "kg"
                          - size: "Small"
                            unit: "kg"
                      color:
                        type: string
                        example: "Brown"
                        description: "Primary color of the variant."
                      measurement:
                        type: string
                        example: "10x10 inches"
                        description: "Measurement details for the variant."
                      discount_start_date:
                        type: string
                        format: date
                        example: "2024-11-01"
                        description: "Start date for the variant's discount."
                      discount_end_date:
                        type: string
                        format: date
                        example: "2024-11-30"
                        description: "End date for the variant's discount."
                      images:
                        type: array
                        items:
                          type: string
                        example:
                          - "teddymart/images/UqcW7siP6S4VYg4ZjrGB.png"
                          - "teddymart/images/UqcW7siP6S4VYg4ZjrGB.png"
                        description: "List of image filenames or URLs for the variant."
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/listings/{userStore}/listing/{listing}:
    get:
      security:
        - bearerAuth: []
      tags:
        - User Store Listings
      summary: Get User Store Listing
      description: "Get User Store Listing"
      operationId: GetUserStoreListing
      parameters:
        - in: path
          name: userStore
          schema:
            type: string
            example: amala-sky
          required: true
        - in: path
          name: listing
          schema:
            type: string
            example: pounded-yam
          required: true

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/listings/{userStore}/listing/{listing}/set-availability:
    patch:
      security:
        - bearerAuth: []
      tags:
        - User Store Listings
      summary: Set Availability User Store Listing
      description: Set Availability User Store Listing
      operationId: SetAvailabilityUserStoreListing
      parameters:
        - in: path
          name: userStore
          schema:
            type: string
            example: amala-sky
          required: true
        - in: path
          name: listing
          schema:
            type: string
            example: pounded-yam
          required: true

      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                is_available:
                  type: number
                  example: 0

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/listings/{userStore}/listing/{listing}/update:
    patch:
      security:
        - bearerAuth: []
      tags:
        - User Store Listings
      summary: Update User Store Listing
      description: >
        Comprehensive endpoint for updating a store listing with support for
        main listing details, attributes, and product variants.
      operationId: UpdateUserStoreListing
      parameters:
        - in: path
          name: userStore
          required: true
          schema:
            type: string
            description: Store slug/identifier
            example: amala-sky
        - in: path
          name: listing
          required: true
          schema:
            type: string
            description: Listing slug/identifier
            example: pounded-yam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Listing name
                  example: "Amala Full plate"
                type:
                  type: string
                  description: Listing type
                  enum:
                    - product
                    - service
                  example: "product"
                price:
                  type: string
                  description: Listing price
                  example: "1000"
                currency:
                  type: string
                  description: Currency for pricing
                  example: "USD"
                description:
                  type: string
                  description: Detailed listing description
                  example: "Delicious Amala served with your choice of soup."
                additional_information:
                  type: string
                  description: Extra listing details
                  example: "Can be customized with different soups."
                images:
                  type: array
                  description: List of listing images
                  items:
                    type: string
                  example: ["teddymart/images/UqcW7siP6S4VYg4ZjrGB.png", "teddymart/images/UqcW7siP6S4VYg4ZjrGB.png"]
                category:
                  type: integer
                  description: Category ID for the listing
                  example: 11
                discount:
                  type: number
                  description: Discount percentage
                  example: 10
                discount_start_date:
                  type: string
                  format: date
                  description: Discount start date
                  example: "2024-11-01"
                discount_end_date:
                  type: string
                  format: date
                  description: Discount end date
                  example: "2024-11-30"
                sku:
                  type: string
                  description: Stock Keeping Unit
                  example: "AMALAFP001"
                quantity:
                  type: integer
                  description: Available quantity
                  example: 1
                is_draft:
                  type: boolean
                  description: Draft status of the listing
                  example: false
                attributes:
                  type: object
                  description: Product-specific attributes
                  properties:
                    measurement:
                      type: string
                      description: Dimensions or measurements
                      example: "10x10 inches"
                    product_model:
                      type: string
                      description: Model identifier for the product
                      example: "Amala2024"
                    brand:
                      type: string
                      description: Product brand
                      example: "Amala Heaven"
                    material:
                      type: string
                      description: Material composition of the product
                      example: "Wheat flour"
                    color:
                      type: string
                      description: Color of the product
                      example: "Brown"
                    size:
                      type: array
                      description: Available sizes of the product
                      items:
                        type: object
                        properties:
                          size:
                            type: string
                            description: Size label
                            example: "Large"
                          unit:
                            type: string
                            description: Unit of measurement for size
                            example: "kg"
                      example:
                        - size: "Large"
                          unit: "kg"
                        - size: "Medium"
                          unit: "kg"
                        - size: "Small"
                          unit: "kg"
                    tags:
                      type: array
                      description: Tags associated with the product
                      items:
                        type: string
                      example: ["amala", "food", "delicious"]
                    size_chart_html:
                      type: string
                      description: HTML representation of size chart
                      example: "<h3>Size Chart</h3><ul><li>Large: 10x10 inches</li><li>Medium: 8x8 inches</li></ul>"
                    size_chart_image:
                      type: string
                      description: Size chart image URL
                      example: "teddymart/images/UqcW7siP6S4VYg4ZjrGB.png"
                variants:
                  type: array
                  description: Product variants
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Variant name
                        example: "Amala with Goat Meat"
                      quantity:
                        type: integer
                        description: Quantity available for the variant
                        example: 50
                      price:
                        type: string
                        description: Price of the variant
                        example: "1500"
                      discount:
                        type: number
                        description: Discount percentage for the variant
                        example: 5
                      size:
                        type: array
                        description: Sizes available for the variant
                        items:
                          type: object
                          properties:
                            size:
                              type: string
                              description: Size label for the variant
                              example: "Large"
                            unit:
                              type: string
                              description: Unit of measurement for size
                              example: "kg"
                        example:
                          - size: "Large"
                            unit: "kg"
                          - size: "Small"
                            unit: "kg"
                      color:
                        type: string
                        description: Color of the variant
                        example: "Brown"
                      measurement:
                        type: string
                        description: Dimensions of the variant
                        example: "10x10 inches"
                      discount_start_date:
                        type: string
                        format: date
                        description: Start date for the variant's discount
                        example: "2024-11-01"
                      discount_end_date:
                        type: string
                        format: date
                        description: End date for the variant's discount
                        example: "2024-11-30"
                      images:
                        type: array
                        description: List of variant images
                        items:
                          type: string
                        example: ["teddymart/images/UqcW7siP6S4VYg4ZjrGB.png", "teddymart/images/UqcW7siP6S4VYg4ZjrGB.png"]
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/listings/{userStore}/listing/{listing}/delete:
    delete:
      security:
        - bearerAuth: []
      tags:
        - User Store Listings
      summary: Delete User Store Listing
      description: "Delete User Store Listing"
      operationId: DeleteUserStoreListing
      parameters:
        - in: path
          name: userStore
          schema:
            type: string
            example: amala-sky
          required: true
        - in: path
          name: listing
          schema:
            type: string
            example: pounded-yam
          required: true

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/shipping/save-method:
    post:
      security:
        - bearerAuth: []
      tags:
        - User Store Shipping Methods
      summary: Save User Store Shipping Method
      description: Save User Store Shipping Method
      operationId: SaveUserStoreShippingMethod

      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  example: 1
                store_id:
                  type: integer
                  example: 1
                  required: true
                method_type:
                  type: string
                  example: "store pick-up"
                  required: true
                pick_up_time:
                  type: string
                  example: "40 years and 30mins"
                pick_up_location:
                  type: string
                  example: "ojuelegba street"
                fulfilled_amount:
                  type: string
                  example: "200"
                fulfilled_location:
                  type: string
                  example: "surulere street"

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/shipping/remove-method-type:
    post:
      security:
        - bearerAuth: []
      tags:
        - User Store Shipping Methods
      summary: Remove User Store Shipping Method Type
      description: Remove User Store Shipping Method Type
      operationId: RemoveUserStoreShippingMethodType

      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                store_id:
                  type: integer
                  example: 1
                  required: true
                method_type:
                  type: string
                  example: "store pick-up"
                  required: true

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/shipping/delete-method/{shippingMethod}:
    delete:
      security:
        - bearerAuth: []
      tags:
        - User Store Shipping Methods
      summary: Delete User Store Shipping Method
      description: "Delete User Store Shipping Method"
      operationId: DeleteUserStoreShippingMethod
      parameters:
        - in: path
          name: shippingMethod
          schema:
            type: integer
            example: 1
          required: true

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/shipping/{userStore}/methods:
    get:
      security:
        - bearerAuth: []
      tags:
        - User Store Shipping Methods
      summary: Get User Store Shipping Methods
      description: "Get User Store Shipping Methods"
      operationId: GetUserStoreShippingMethods
      parameters:
        - in: path
          name: userStore
          schema:
            type: string
            example: amala-sky
          required: true

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /store/{userStore}/ratings:
    get:
      security:
        - bearerAuth: []
      tags:
        - User Store Ratings
      summary: Get User Store Ratings
      description: "Get User Store Ratings"
      operationId: GetUserStoreRatings
      parameters:
        - in: path
          name: userStore
          schema:
            type: string
            example: amala-sky
          required: true

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object
