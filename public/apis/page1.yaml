openapi: "3.0.0"
info:
  description: Teddymart apis
  version: 1.0.0
  title: Teddmart

servers:
  - url: /api
    description: v1 baseUrl

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /front/register:
    post:
      tags:
        - Authentication
      summary: register users step one
      description: register users step one
      operationId: RegisterStepOne
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "Teddy"
                last_name:
                  type: string
                  example: "Edward"
                email:
                  type: string
                  example: "kings@eki.market"
                password:
                  type: string
                  example: "12345678"
                password_confirmation:
                  type: string
                  example: "12345678"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/register/verify:
    post:
      tags:
        - Authentication
      summary: register users step two verify otp
      description: register users step two verify otp
      operationId: RegisterStepTwo
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "Teddy"
                last_name:
                  type: string
                  example: "Edward"
                email:
                  type: string
                  example: "kings@eki.market"
                password:
                  type: string
                  example: "12345678"
                password_confirmation:
                  type: string
                  example: "12345678"
                code:
                  type: string
                  example: "123456"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/register/otp-resend:
    post:
      tags:
        - Authentication
      summary: register users step two resend otp
      description: register users step two resend otp
      operationId: RegisterStepTwoResend
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "teddyedward@teddyed.com"

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/login:
    post:
      tags:
        - Authentication
      summary: login users
      description: login users
      operationId: login
      parameters:
        - in: header
          name: Clip-Uid
          schema:
            type: string
            example:
          required: false
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: teddyedward@teddyed.com
                password:
                  type: string
                  example: "12345678"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/reset/send-otp:
    post:
      tags:
        - Authentication
      summary: send otp to reset password
      description: send otp to reset password
      operationId: sendOtpToResetPassword
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "teddyedward@teddyed.com"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/reset:
    post:
      tags:
        - Authentication
      summary: reset password
      description: reset password
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "teddyedward@teddyed.com"
                password:
                  type: string
                  example: "12345678"
                password_confirmation:
                  type: string
                  example: "12345678"
                otp:
                  type: string
                  example: "123456"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/category:
    get:
      tags:
        - Category
      summary: get all category
      description: get all category
      operationId: GetAllCategory
      parameters:
        - name: type
          in: query
          description: Filter categories by type Service or product
          required: false
          schema:
            type: string
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/record-interaction/{category}:
      get:
        tags:
          - Category
        summary: Record category interaction
        description: Record category interaction
        operationId: RecordCategoryInteraction
        parameters:
          - name: Interact_Uid
            in: header
            required: true
            schema:
              type: string
          - name: category
            in: path
            required: true
            schema:
              type: string

        responses:
          default:
            description: 'success'
            content:
              application/json:
                schema:
                  type: object

  /front/user/profile:
    get:
      tags:
        - User
      summary: get user profile
      description: get user profile
      operationId: GetUserProfile
      security:
        - bearerAuth: []
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/user/profile/update:
    put:
      tags:
        - User
      summary: update user profile
      description: update user profile
      operationId: UpdateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "Teddy"
                  required: true
                last_name:
                  type: string
                  example: "Edward"
                  required: true
                email:
                  type: string
                  example: "teddyedward@teddyed.com"
                  required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/user/change-password:
    patch:
      tags:
        - User
      summary: change user password
      description: change user password
      operationId: ChangeUserPassword
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                  example: "12345678"
                new_password:
                  type: string
                  example: "12345678"
                new_password_confirmation:
                  type: string
                  example: "12345678"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/user/logout:
    post:
      tags:
        - User
      summary: logout user
      description: logout user
      operationId: LogoutUser
      security:
        - bearerAuth: []
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/file-upload:
    post:
      tags:
        - General
      summary: upload Image file
      description: API endpoint to upload multiple base64 encoded images
      operationId: uploadBase64Images
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    description: Base64 encoded image string
                    example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAIAQMAAAD+wSzIAAAABlBMVEX///+/v7+jQ3Y5AAAADklEQVQI12P4AIX8EAgALgAD/aNpbtEAAAAASUVORK5CYII"

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/file-delete:
    post:
      tags:
        - General
      summary: delete Image file
      description: delete Image file
      operationId: DeleteImageFile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paths:
                  type: array
                  items:
                    type: string
                    example: "/your-space-url/image-path.jpg"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /countries:
    get:
      servers:
        - url: /api/location
      tags:
        - Map
      summary: get all countries
      description: "get all countries with an optional search"
      operationId: getAllCountries
      parameters:
        - in: query
          name: search
          schema:
            type: string
            example: "benin"
          required: false

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /countries/{country}/divisions:
    get:
      servers:
        - url: /api/location
      tags:
        - Map
      summary: country division
      description: "get countries by country primary ID with an optional search"
      operationId: countryDivision
      parameters:
        - in: path
          name: country
          schema:
            type: number
            example: 2
          required: true
        - in: query
          name: search
          schema:
            type: string
            example: "Atakora"
          required: false

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/add-to-clip/{product}:
    post:
      tags:
        - Clip
      summary: add product to clip
      description: add product to clip
      operationId: AddProductToClip
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: product
          schema:
            type: string
            example: "pounded-yam"
          required: true
        - in: header
          name: Clip-Uid
          schema:
            type: string
            example:
          required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/clips:
    get:
      tags:
        - Clip
      summary: get all clip
      description: get all clip
      operationId: GetAllClip
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Clip-Uid
          schema:
            type: string
            example:
          required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/clip/{clip}:
    get:
      tags:
        - Clip
      summary: view clip by id
      description: view clip by id
      operationId: ViewClipById
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clip
          schema:
            type: integer
            example: 1
          required: true
        - in: header
          name: Clip-Uid
          schema:
            type: string
            example:
          required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/clips/{clip}/items/{product}:
    delete:
      tags:
        - Clip
      summary: remove product from clip
      description: remove product from clip
      operationId: RemoveProductFromClip
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clip
          schema:
            type: string
            example: "1"
          required: true
        - in: path
          name: product
          schema:
            type: string
            example: "pounded-yam"
          required: true
        - in: header
          name: Clip-Uid
          schema:
            type: string
            example:
          required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/clips/{clip}:
    delete:
      tags:
        - Clip
      summary: remove clip
      description: remove clip
      operationId: RemoveClip
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clip
          schema:
            type: string
            example: "1"
          required: true
        - in: header
          name: Clip-Uid
          schema:
            type: string
            example:
          required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/clip/{clip}/order:
    post:
      tags:
        - Clip
      summary: order clip
      description: order clip
      operationId: OrderClip
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clip
          schema:
            type: string
            example: "1"
          required: true
        - in: header
          name: Clip-Uid
          schema:
            type: string
            example:
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "Teddy"
                  required: true
                last_name:
                  type: string
                  example: "Edwardson"
                  required: true
                email:
                  type: string
                  example: "teddyedward@teddyed.com"
                  required: true
                phone:
                  type: string
                  example: "2348012345678"
                  required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/clip/{order}/send-to-vendor:
    post:
      tags:
        - Clip
      summary: send clip order to vendor
      description:  send clip order to vendor
      operationId: SendOrderClip
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: order
          schema:
            type: string
            example: "1"
          required: true
        - in: header
          name: Clip-Uid
          schema:
            type: string
            example:
          required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object



  /front/stores/{store}:
    get:
      security:
        - bearerAuth: []
      tags:
        - Stores
      summary: Get Specified Store
      description: "Get Specified Store"
      operationId: GetSpecifiedStore
      parameters:
        - in: path
          name: store
          schema:
            type: string
            example: "amala-sky"
          required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/stores/{store}/listings:
    get:
      security:
        - bearerAuth: []
      tags:
        - Stores
      summary: Get Specified Store Listings
      description: "Get Specified Store Listings"
      operationId: GetSpecifiedStoreListings
      parameters:
        - in: query
          name: listingType
          schema:
            type: string
            example: "product"
        - in: path
          name: store
          schema:
            type: string
            example: "amala-sky"

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/stores:
    get:
      security:
        - bearerAuth: []
      tags:
        - Stores
      summary: Get Store Lists
      description: "Get Store Lists"
      operationId: GetStoreLists
      parameters:
        - in: query
          name: listingType
          schema:
            type: string
            example: "product"
        - in: query
          name: category
          schema:
            type: number
            example: 11
        - in: query
          name: search
          schema:
            type: string
            example: "amala"

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/stores/recommended-stores:
    get:
      security:
        - bearerAuth: []
      tags:
        - Stores
      summary: Get Recommended Store Lists
      description: "Get Recommended Store Lists"
      operationId: GetRecommendedStoreLists
      parameters:
        - name: Interact_Uid
          in: header
          required: true
          schema:
            type: string
      
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/stores/{store}/listings/{listing}:
    get:
      security:
        - bearerAuth: []
      tags:
        - Stores
      summary: Get Specified Store Listing
      description: "Get Specified Store Listing"
      operationId: GetSpecifiedStoreListing
      parameters:
        - in: path
          name: store
          schema:
            type: string
            example: "amala-sky"
          required: true
        - in: path
          name: listing
          schema:
            type: string
            example: "amala-with-afang"
          required: true

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

