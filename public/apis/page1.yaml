openapi: '3.0.0'
info:
  description: Teddyed apis
  version: 1.0.0
  title: Teddyed

servers:
  - url: /api
    description: v1 baseUrl

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:

  /front/register:
    post:
      tags:
        - Authentication
      summary: register users step one
      description: register users step one
      operationId: RegisterStepOne
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: 'Teddy'
                last_name:
                  type: string
                  example: 'Edward'
                email:
                  type: string
                  example: 'teddyedward@teddyed.com'
                password:
                  type: string
                  example: 'teddy767112##'
                password_confirmation:
                  type: string
                  example: 'teddy767112##'

      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /front/register/verify:
    post:
      tags:
        - Authentication
      summary: register users step two verify otp
      description: register users step two verify otp
      operationId: RegisterStepTwo
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: 'Teddy'
                last_name:
                  type: string
                  example: 'Edward'
                email:
                  type: string
                  example: 'teddyedward@teddyed.com'
                password:
                  type: string
                  example: 'teddy767112##'
                password_confirmation:
                  type: string
                  example: 'teddy767112##'
                code:
                  type: string
                  example: '123456'

      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /front/register/otp-resend:
    post:
      tags:
        - Authentication
      summary: register users step two resend otp
      description: register users step two resend otp
      operationId: RegisterStepTwoResend
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'teddyedward@teddyed.com'

      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /front/login:
    post:
      tags:
        - Authentication
      summary: login users
      description: login users
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: teddyedward@teddyed.com
                password:
                  type: string
                  example: '12345678'
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /front/reset/send-otp:
    post:
      tags:
        - Authentication
      summary: send otp to reset password
      description: send otp to reset password
      operationId: sendOtpToResetPassword
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'teddyedward@teddyed.com'
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /front/reset:
    post:
      tags:
        - Authentication
      summary: reset password
      description: reset password
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: 'teddyedward@teddyed.com'
                password:
                  type: string
                  example: '12345678'
                password_confirmation:
                  type: string
                  example: '12345678'
                otp:
                  type: string
                  example: '123456'
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /front/category:
    get:
      tags:
        - Category
      summary: get all category
      description: get all category
      operationId: GetAllCategory
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /front/category/product:
    get:
      tags:
        - Category
      summary: get all product category
      description: get all product category
      operationId: GetAllProductCategory
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /front/category/service:
    get:
      tags:
        - Category
      summary: get all service category
      description: get all service category
      operationId: GetAllServiceCategory
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /front/user/profile:
    get:
      tags:
        - User
      summary: get user profile
      description: get user profile
      operationId: GetUserProfile
      security:
        - bearerAuth: []
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /front/user/profile/update:
    put:
      tags:
        - User
      summary: update user profile
      description: update user profile
      operationId: UpdateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: 'Teddy'
                  required: true
                last_name:
                  type: string
                  example: 'Edward'
                  required: true
                email:
                  type: string
                  example: 'teddyedward@teddyed.com'
                  required: true
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object

  /front/user/change-password:
    patch:
      tags:
        - User
      summary: change user password
      description: change user password
      operationId: ChangeUserPassword
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                  example: '12345678'
                new_password:
                  type: string
                  example: '12345678'
                new_password_confirmation:
                  type: string
                  example: '12345678'
      responses:
        default:
          description: 'success'
          content:
            application/json:
              schema:
                type: object
