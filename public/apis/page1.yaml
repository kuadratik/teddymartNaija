                  type: array
                  items:
                    type: string
                    example: "/your-space-url/image-path.jpg"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /countries:
    get:
      servers:
        - url: /api/location
      tags:
        - Map
      summary: get all countries
      description: "get all countries with an optional search"
      operationId: getAllCountries
      parameters:
        - in: query
          name: search
          schema:
            type: string
            example: "benin"
          required: false

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /countries/{country}/divisions:
