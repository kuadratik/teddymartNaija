openapi: "3.0.0"
info:
  description: Teddymart apis
  version: 1.0.0
  title: Teddmart

servers:
  - url: /api
    description: v1 baseUrl

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /front/register:
    post:
      tags:
        - Authentication
      summary: register users step one
      description: register users step one
      operationId: RegisterStepOne
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "Teddy"
                last_name:
                  type: string
                  example: "Edward"
                email:
                  type: string
                  example: "kings@eki.market"
                refferalCode:
                  type: string
                  example: "REFTED123456"
                  nullable: true
                refferalType:
                  type: string
                  example: "vendor"
                  nullable: true
                password:
                  type: string
                  example: "12345678"
                password_confirmation:
                  type: string
                  example: "12345678"

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/google-auth:
    post:
      tags:
        - Authentication
      summary: Login or register with google
      description: Verify Google token To Login or register a User
      operationId: GoogleAuth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/register/verify:
    post:
      tags:
        - Authentication
      summary: register users step two verify otp
      description: register users step two verify otp
      operationId: RegisterStepTwo
      parameters:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "Teddy"
                last_name:
                  type: string
                  example: "Edward"
                email:
                  type: string
                  example: "kings@eki.market"
                refferalCode:
                  type: string
                  example: "REFTED123456"
                  nullable: true
                refferalType:
                  type: string
                  example: "vendor"
                  nullable: true
                password:
                  type: string
                  example: "12345678"
                password_confirmation:
                  type: string
                  example: "12345678"
                code:
                  type: string
                  example: "123456"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/register/otp-resend:
    post:
      tags:
        - Authentication
      summary: register users step two resend otp
      description: register users step two resend otp
      operationId: RegisterStepTwoResend
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "teddyedward@teddyed.com"

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/login:
    post:
      tags:
        - Authentication
      summary: login users
      description: login users
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: teddyedward@teddyed.com
                password:
                  type: string
                  example: "12345678"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/auth-confirmation:
    post:
      security:
        - bearerAuth: []
      tags:
        - Authentication
      summary: Check if the auth user password is correct
      description: Check if the auth user password is correct
      operationId: AuthOnce
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  example: "12345678"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/reset/send-otp:
    post:
      tags:
        - Authentication
      summary: send otp to reset password
      description: send otp to reset password
      operationId: sendOtpToResetPassword
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "teddyedward@teddyed.com"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/reset:
    post:
      tags:
        - Authentication
      summary: reset password
      description: reset password
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: "teddyedward@teddyed.com"
                password:
                  type: string
                  example: "12345678"
                password_confirmation:
                  type: string
                  example: "12345678"
                otp:
                  type: string
                  example: "123456"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/category:
    get:
      tags:
        - Category
      summary: get all category
      description: get all category
      operationId: GetAllCategory
      parameters:
        - name: type
          in: query
          description: Filter categories by type Service or product
          required: false
          schema:
            type: string
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/record-interaction/{category}:
    get:
      tags:
        - Category
      summary: Record category interaction
      description: Record category interaction
      operationId: RecordCategoryInteraction
      parameters:
        - name: interactUid
          in: header
          required: true
          schema:
            type: string
        - name: category
          in: path
          required: true
          schema:
            type: string

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/user/profile:
    get:
      tags:
        - User
      summary: get user profile
      description: get user profile
      operationId: GetUserProfile
      security:
        - bearerAuth: []
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/user/profile/update:
    put:
      tags:
        - User
      summary: update user profile
      description: update user profile
      operationId: UpdateUserProfile
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: "Teddy"
                  required: true
                last_name:
                  type: string
                  example: "Edward"
                  required: true
                email:
                  type: string
                  example: "teddyedward@teddyed.com"
                  required: true
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/user/change-password:
    patch:
      tags:
        - User
      summary: change user password
      description: change user password
      operationId: ChangeUserPassword
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                  example: "12345678"
                new_password:
                  type: string
                  example: "12345678"
                new_password_confirmation:
                  type: string
                  example: "12345678"
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/user/logout:
    post:
      tags:
        - User
      summary: logout user
      description: logout user
      operationId: LogoutUser
      security:
        - bearerAuth: []
      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/file-upload:
    post:
      tags:
        - General
      summary: upload Image file
      description: API endpoint to upload multiple base64 encoded images
      operationId: uploadBase64Images
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    description: Base64 encoded image string
                    example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAIAQMAAAD+wSzIAAAABlBMVEX///+/v7+jQ3Y5AAAADklEQVQI12P4AIX8EAgALgAD/aNpbtEAAAAASUVORK5CYII"

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/upload-file:
    post:
      tags:
        - General
      summary: upload Image file for unauthenticated users
      description: API endpoint to upload multiple base64 encoded images
      operationId: uploadBase64Images
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items:
                    type: string
                    description: Base64 encoded image string
                    example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAIAQMAAAD+wSzIAAAABlBMVEX///+/v7+jQ3Y5AAAADklEQVQI12P4AIX8EAgALgAD/aNpbtEAAAAASUVORK5CYII"

      responses:
        default:
          description: "success"
          content:
            application/json:
              schema:
                type: object

  /front/video-file-upload:
    post:
      tags:
